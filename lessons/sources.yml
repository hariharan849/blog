# Sources for the daily lessons (see lessons/connectors.py).
#
# Each morning the workflow checks every source, finds items that are new
# since the last run and turns up to `max_per_run` of them into lessons.
# Nothing is published twice. Items left over wait for the next run.
#
# type: youtube   a video, a playlist (/playlist?list=...) or a channel (/@name)
# type: substack  a Substack name or URL, or a person's profile (substack.com/@name)
# type: medium    a Medium @username or URL
# type: rss       any RSS / Atom feed URL
# type: github    a GitHub user/org (each new repo) or one repository;
#                 these become architecture write-ups
#
# backfill decides whether items that already exist when you add a source
# become lessons: true (all), false (none) or a number (that many of the most
# recent). Default: true for single videos, playlists and single repos; false
# for channels, feeds and GitHub users (only new posts from then on).

settings:
  max_per_run: 3

# YouTube is off for now: it blocks transcript downloads from GitHub's servers
# unless a proxy or cookies secret is set (see the workflow file). The
# connector is still here; add a youtube source again to turn it back on.

sources:
  # Miguel Otero Pedrido's newsletter, The Neural Maze (theneuralmaze.com)
  - type: substack
    url: substack.com/@migueloteropedrido
    backfill: 1   # start with the latest existing post, then only new ones

  # Examples:
  # - type: substack
  #   url: newsletter-name
  # - type: medium
  #   url: "@username"
  # - type: github
  #   url: https://github.com/some-org
  # - type: youtube   (needs YOUTUBE_PROXY_URL, WEBSHARE_PROXY_* or YOUTUBE_COOKIES)
  #   url: https://www.youtube.com/playlist?list=PLxxxxxxxxxxxxxxxx
