version: 2.1

jobs:
  backend:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install backend dependencies
          command: pip install -r backend/requirements.txt
      - run:
          name: Run backend tests
          working_directory: backend
          command: DJANGO_SECRET_KEY=ci python manage.py test
      - run:
          name: Check for missing migrations
          working_directory: backend
          command: DJANGO_SECRET_KEY=ci python manage.py makemigrations --check --dry-run

  frontend:
    docker:
      - image: cimg/node:22.12
    steps:
      - checkout
      - run:
          name: Install frontend dependencies
          working_directory: frontend
          command: npm ci
      - run:
          name: Lint, typecheck, test and build
          working_directory: frontend
          command: npm run lint && npm run typecheck && npm test && npm run build

workflows:
  build-and-test:
    jobs:
      - backend
      - frontend
