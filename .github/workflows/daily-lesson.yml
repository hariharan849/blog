name: Daily lesson

# Every morning: checks the sources in lessons/sources.yml (YouTube, Substack,
# Medium, RSS, GitHub), turns items that are new since the last run into
# lessons, commits them to frontend/content/lessons together with
# lessons/state.json (the site shows them in the Daily Dose tab), then emails a
# short version to Daily Dose subscribers.
#
# Setup (repository Settings → Secrets and variables → Actions):
#   secret   ANTHROPIC_API_KEY        Claude API key used to write the lessons
# YouTube often blocks transcript requests from GitHub's servers. Add one of:
#   secret   YOUTUBE_PROXY_URL        http(s) proxy, ideally residential
#   secrets  WEBSHARE_PROXY_USERNAME / WEBSHARE_PROXY_PASSWORD   Webshare residential proxy
#   secret   YOUTUBE_COOKIES          contents of a cookies.txt from a signed-in browser
# Emailing subscribers also needs the backend to be deployed:
#   variable FEED_API_URL             the backend's ApiUrl output
#   secret   FEED_ADMIN_TOKEN         same value as /dailydose/admin-token in SSM
# The /admin "Reading list" starts this workflow with links (workflow_dispatch input
# `urls`). It needs LESSONS_GITHUB_TOKEN on Vercel: a fine-grained token for this
# repository with "Actions: Read and write".

on:
  schedule:
    - cron: "30 0 * * *" # 06:00 IST
  workflow_dispatch:
    inputs:
      urls:
        description: "Optional: video, repo or feed links separated by spaces, instead of the sources file"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-lesson
  cancel-in-progress: false

jobs:
  lesson:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      YOUTUBE_PROXY_URL: ${{ secrets.YOUTUBE_PROXY_URL }}
      WEBSHARE_PROXY_USERNAME: ${{ secrets.WEBSHARE_PROXY_USERNAME }}
      WEBSHARE_PROXY_PASSWORD: ${{ secrets.WEBSHARE_PROXY_PASSWORD }}
      URLS: ${{ inputs.urls }}
    steps:
      - name: Check setup
        id: setup
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::Daily lesson skipped: set the ANTHROPIC_API_KEY secret."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.setup.outputs.ready == 'true'

      - uses: astral-sh/setup-uv@v6
        if: steps.setup.outputs.ready == 'true'
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: lessons/uv.lock

      - name: Write lessons
        if: steps.setup.outputs.ready == 'true'
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          uv sync --locked --no-dev --project lessons
          if [ -n "$YOUTUBE_COOKIES" ]; then
            printf '%s\n' "$YOUTUBE_COOKIES" > "$RUNNER_TEMP/cookies.txt"
            export YOUTUBE_COOKIES_FILE="$RUNNER_TEMP/cookies.txt"
          fi
          args=()
          for u in $URLS; do args+=(--url "$u"); done
          uv run --no-sync --project lessons python lessons/make_lesson.py "${args[@]}"

      - name: Commit lessons
        id: commit
        if: steps.setup.outputs.ready == 'true'
        run: |
          git add frontend/content/lessons lessons/state.json
          if git diff --cached --quiet; then
            echo "Nothing new today."
            exit 0
          fi
          echo "files=$(git diff --cached --name-only --diff-filter=A -- 'frontend/content/lessons/*.md' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Daily lessons for $(date -u +%F)"
          git push

      - name: Email subscribers
        if: steps.commit.outputs.files != ''
        env:
          FEED_API_URL: ${{ vars.FEED_API_URL }}
          FEED_ADMIN_TOKEN: ${{ secrets.FEED_ADMIN_TOKEN }}
          FILES: ${{ steps.commit.outputs.files }}
        run: |
          # Give the site a few minutes to redeploy so the lesson link works when the email lands.
          if [ -n "$FEED_API_URL" ]; then sleep 180; fi
          uv run --no-sync --project lessons python lessons/announce.py $FILES
